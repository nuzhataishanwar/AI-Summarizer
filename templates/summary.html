<!DOCTYPE html><html>
<head>
    <title>Study Summary</title><style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background-color: #eef2ff;
        font-family: Arial, sans-serif;
        color: #1e293b;
        overflow-x: hidden;
    }

    /* Background circles */
    .circle1,
    .circle2,
    .circle3 {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        z-index: 0;
    }

    .circle1 {
        width: 350px;
        height: 350px;
        left: -120px;
        top: -80px;
        background-color: rgba(37, 99, 235, 0.08);
    }

    .circle2 {
        width: 250px;
        height: 250px;
        right: -80px;
        bottom: -60px;
        background-color: rgba(37, 99, 235, 0.08);
    }

    .circle3 {
        width: 160px;
        height: 160px;
        left: 35%;
        bottom: -70px;
        background-color: rgba(30, 41, 59, 0.06);
    }

    /* Main content */
    .content {
        width: 90%;
        max-width: 1000px;
        margin: 50px auto;
        position: relative;
        z-index: 1;
    }

    /* Title */
    .heading {
        background-color: #1e293b;
        color: white;
        padding: 30px 35px;
        border-radius: 14px;
        margin-bottom: 25px;
    }

    .heading h1 {
        margin: 0 0 8px;
        font-family: Poppins, Arial, sans-serif;
        font-size: 32px;
    }

    .heading p {
        margin: 0;
        color: #cbd5e1;
        font-size: 15px;
    }

    /* Summary box */
    .section {
        background-color: white;
        padding: 30px;
        border-radius: 14px;
        box-shadow: 0 4px 15px rgba(30, 41, 59, 0.08);
        margin-bottom: 25px;
    }

    .section h2 {
        color: #1e293b;
        font-family: Poppins, Arial, sans-serif;
        font-size: 25px;
        margin-top: 0;
        margin-bottom: 15px;
    }

    .summary-text {
        color: #475569;
        font-size: 16px;
        line-height: 1.8;
        white-space: pre-line;
    }

    /* Quiz section */
    .quiz-box {
        background-color: #f8fafc;
        border: 1px solid #e2e8f0;
        padding: 25px;
        border-radius: 12px;
        text-align: center;
    }

    .quiz-box h3 {
        color: #1e293b;
        margin-top: 0;
        font-size: 21px;
    }

    .quiz-box p {
        color: #64748b;
        font-size: 15px;
    }

    .quiz-btn {
        display: inline-block;
        margin-top: 10px;
        padding: 12px 28px;
        background-color: #2563eb;
        color: white;
        border-radius: 8px;
        text-decoration: none;
        font-weight: bold;
    }

    .quiz-btn:hover {
        background-color: #1d4ed8;
    }

    /* Mobile */
    @media (max-width: 600px) {
        .content {
            width: 92%;
            margin: 30px auto;
        }

        .heading h1 {
            font-size: 26px;
        }

        .section {
            padding: 22px;
        }
    }
</style>

</head><body>{% include 'navbar.html' %}

<div class="circle1"></div>
<div class="circle2"></div>
<div class="circle3"></div>

<div class="content">

    <div class="heading">

        <h1>Study Summary</h1>

        <p>
            Your study material has been summarized below.
        </p>

    </div>

    <!-- Summary -->
    <div class="section">

        <h2>Summary</h2>

        <div class="summary-text">
            {{ text|safe }}
        </div>

    </div>

    <!-- Quiz -->
    <div class="quiz-box">

        <h3>Ready to test yourself?</h3>

        <p>
            Create a quiz from this study material
            and see how much you remember.
        </p>

        <a href="/upload" class="quiz-btn">
            Generate Quiz
        </a>

    </div>

</div>

</body>
</html>
